<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mairie</title>
<meta name="description" content="Site de la commune : démarches, patrimoine, mairie.">
<meta name="theme-color" content="#1e0f09">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Black&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="site.css?v=25">
<script src="charge.js?v=25"></script>
</head>
<body>
<a class="skip" href="#contenu">Aller au contenu</a>

<header class="top">
  <a class="brand" href="index.html"><span class="blason" role="img"></span><span><b class="nomC"></b><small>Mairie</small></span></a>
  <nav aria-label="Navigation principale"><a href="demarches.html">Démarches</a><a href="decouvrir.html">Découvrir</a><a href="#mairie">La mairie</a></nav>
</header>

<main id="contenu">
  <section class="hero" aria-labelledby="nom">
    <img id="heroImg" src="" alt="" fetchpriority="high">
    <h1 class="nom" id="nom"></h1>
    <p id="phrase"></p>
    <span class="credit" id="heroCredit"></span>
  </section>

  <nav class="argile entrees" aria-label="Accès rapides" id="entrees"></nav>

  <section class="sec" id="decouvrir" aria-labelledby="tvit">
    <h2 id="tvit"></h2>
    <p class="chapo" id="vitTexte"></p>
    <div class="archives" id="vitrine"></div>
    <a class="lien" href="decouvrir.html" style="margin-top:72px" id="vitLien"></a>
  </section>

  <section class="argile frise" aria-labelledby="trois" id="frise" hidden>
    <header><h2 class="relief-t" id="trois" style="font:900 clamp(2.6rem,7vw,6rem)/.9 var(--titre);text-transform:uppercase"></h2>
    <p class="chapo" id="friseTexte" style="max-width:46ch;margin-top:16px;color:#f6dccb"></p></header>
    <div class="rois" id="rois" tabindex="0" aria-label="Frise des rois, défilement horizontal"></div>
    <p class="glisser">Faites glisser pour voir les autres rois.</p>
    <p class="source" id="roisCredit"></p>
  </section>

  <section class="plein" aria-labelledby="vivant">
    <img id="pleinImg" src="" alt="" loading="lazy">
    <h2 id="vivant"></h2>
    <p id="pleinTexte"></p>
    <a class="lien" href="#mairie">Préparer ma visite</a>
    <p class="credit" id="pleinCredit"></p>
  </section>

  <section class="sec" id="mairie" aria-labelledby="tvenir">
    <h2 id="tvenir"></h2>
    <p class="chapo" id="acces"></p>
    <div class="carte" id="carte"></div>
  </section>
</main>

<footer class="pied">
  <span class="blason" role="img" style="width:72px"></span>
  <div><p class="devise" id="devise"></p><p id="lieuC"></p></div>
  <p class="credits" id="credits"></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="commun.js?v=25"></script>
<script src="vivant.js?v=25"></script>
<script src="symboles.js?v=25"></script>
<script>
const C = COMMUNE, $ = (s) => document.querySelector(s), ARG = getComputedStyle(document.documentElement).getPropertyValue("--argile").trim();
const a = /^[AEIOUÉÈ]/i.test(C.nom) ? "à " : "à ";
document.title = C.titre || C.nom;
document.querySelector('meta[name=description]').content = `Site de la commune ${DE}${C.nom} (${C.departement}, Bénin) : démarches, patrimoine, mairie.`;
document.querySelectorAll(".nomC").forEach((e) => e.textContent = C.nom);

// hero : le nom monte lettre par lettre
$("#heroImg").src = C.img + (C.hero.mobile && matchMedia("(max-width:819px)").matches ? C.hero.mobile : C.hero.img); $("#heroImg").alt = C.hero.alt;
if (C.hero.position) $("#heroImg").style.objectPosition = C.hero.position;
$("#nom").setAttribute("aria-label", C.nom);
$("#nom").style.setProperty("--n", C.nom.length);
$("#nom").innerHTML = [...C.nom].map((l, i) => `<span style="--i:${i}" aria-hidden="true">${l}</span>`).join("");
$("#phrase").textContent = C.phrase;
$("#heroCredit").textContent = C.hero.credit;

const [s1, s2] = C.symboles || ["trone", "poisson"];
$("#entrees").innerHTML = [
  ["demarches.html", "Démarches", "Naissance, résidence, permis, taxes", SYM[s1]("currentColor", ARG)],
  ["decouvrir.html", "Découvrir", C.accroche, SYM[s2]("currentColor", ARG)],
  ["#mairie", "La mairie", `Horaires, contacts, ${C.arrondissements.length} arrondissements`, SYM.palmier("currentColor")]
].map(([h, t, d, s]) => `<a href="${h}"><span class="relief">${s}</span><span><b class="relief-t">${t}</b><small>${d}</small></span></a>`).join("");

const V = C.vitrine;
$("#tvit").textContent = V.titre; $("#vitTexte").textContent = V.texte; $("#vitLien").textContent = V.lien;
if (!V.archive) {
  // bande qui défile : la vitrine, puis les images du récit Découvrir
  const vues = [...V.imgs.map((m) => ({ src: m.src, alt: m.alt, leg: m.legende })),
    ...C.decouvrir.flatMap((c) => [c.grande, c.petite].filter(Boolean).map((m) => ({ src: m.src, alt: m.alt, leg: `${c.titre}. ${m.credit}` })))]
    .filter((v, i, a) => a.findIndex((w) => w.src === v.src) === i).slice(0, 12);
  // vitrine en trios, mise en page d'Abomey : avance seule, flèches discrètes, jamais pilotée par le défilement
  const trios = []; for (let i = 0; i + 3 <= vues.length; i += 3) trios.push(vues.slice(i, i + 3));
  const fig = (v, i) => `<figure class="a${i + 1}"><div class="cadre"><img src="${C.img + v.src}" alt="${v.alt}" loading="lazy"></div><figcaption>${v.leg}</figcaption></figure>`;
  const ico = (d) => `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  $("#vitrine").outerHTML = `<div class="carrousel" id="vitrine" role="region" aria-roledescription="carrousel" aria-label="Images de ${C.nom}">
    <div class="vues">${trios.map((t, k) => `<div class="trio${k ? "" : " on"}" role="group" aria-label="${k + 1} sur ${trios.length}"${k ? ' aria-hidden="true"' : ""}>${t.map(fig).join("")}</div>`).join("")}</div>
    <div class="fleches"><span class="compte"><b>01</b> / ${String(trios.length).padStart(2, "0")}</span>
      <button type="button" class="prec" aria-label="Images précédentes">${ico("M15 5l-7 7 7 7")}</button>
      <button type="button" class="suiv" aria-label="Images suivantes">${ico("M9 5l7 7-7 7")}</button></div></div>`;
  const car = $("#vitrine"), ts = [...car.querySelectorAll(".trio")];
  let k = 0, minuteur;
  const montre = (n) => { k = (n + ts.length) % ts.length; ts.forEach((t, j) => { t.classList.toggle("on", j === k); t.toggleAttribute("aria-hidden", j !== k); });
    car.querySelector(".compte b").textContent = String(k + 1).padStart(2, "0"); };
  const lance = () => { clearInterval(minuteur); if (!matchMedia("(prefers-reduced-motion: reduce)").matches && ts.length > 1) minuteur = setInterval(() => { if (!document.hidden && !car.matches(":hover, :focus-within")) montre(k + 1); }, 6000); };
  car.querySelector(".prec").addEventListener("click", () => { montre(k - 1); lance(); });
  car.querySelector(".suiv").addEventListener("click", () => { montre(k + 1); lance(); });
  lance();
} else $("#vitrine").innerHTML = V.imgs.map((m, i) =>
  `<figure class="a${i + 1}"><div class="cadre"${V.archive ? "" : ' style="background:var(--argile-f)"'}><img src="${C.img + m.src}" alt="${m.alt}" loading="lazy"${V.archive ? "" : ' style="transform:none"'}></div><figcaption>${m.legende}</figcaption></figure>`).join("");

if (C.rois) {
  $("#frise").hidden = false;
  $("#trois").textContent = C.frise.titre; $("#friseTexte").textContent = C.frise.texte;
  $("#rois").innerHTML = C.rois.map((r) =>
    `<article class="roi"><div class="medaillon"><img src="${C.img + r.img}" alt="Médaillon du roi ${r.nom}" loading="lazy"></div><b class="relief-t">${r.nom}</b><span class="regne">${r.regne}</span><p>${r.d}</p></article>`).join("");
  $("#roisCredit").textContent = C.roisCredit;
}

const P = C.plein;
$("#pleinImg").src = C.img + P.img; $("#pleinImg").alt = P.alt;
$("#vivant").textContent = P.titre; $("#pleinTexte").textContent = P.texte; $("#pleinCredit").textContent = P.credit;

$("#tvenir").textContent = `Venir ${a}${C.nom}`;
$("#acces").textContent = `${C.acces} Choisissez un lieu, la carte vous y emmène.`;
$("#devise").textContent = C.devise;
$("#lieuC").textContent = `Commune ${DE}${C.nom}, département ${/^[AEIOUÉÈ]/i.test(C.departement) ? "de l'" : "du "}${C.departement}, République du Bénin.`;
$("#credits").textContent = `${C.creditsPied} Carte © OpenStreetMap. Maquette de démonstration.`;
carte($("#carte"));
document.body.insertAdjacentHTML("beforeend", TABS(0));
</script>
</body>
</html>
